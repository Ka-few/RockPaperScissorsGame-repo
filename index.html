<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <div class="choices">
            <button id="rock" class="choice">✊Rock</button>
            <button id="paper" class="choice">✋Paper</button>
            <button id="scissors" class="choice">✌️Scissors</button>
        </div>
        <div class="result">
            <p id="userChoice">You choose: <span>-</span></p>
            <div id="computerChoiceContainer">
                <span id="computerChoiceIcon">🤖</span>
                <p id="computerChoice">Computer Chose: <span>-</span></p>
            </div>
            <p id="gameResult">Result: <span>-</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
